apiVersion: v1
kind: Service
metadata:
  name: web1-svc
  namespace: default
  labels:
    app: web1
spec:
  type: ClusterIP
  selector:
    app: web1
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP

